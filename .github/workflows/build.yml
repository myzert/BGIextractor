name: Build and Release BGIE

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller
    - name: Build Standalone EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "BGIExtractor-Win64" --add-data "src;src" bgie_app.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BGIExtractor-Win64.exe
        path: dist/BGIExtractor-Win64.exe

  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller
    - name: Build Linux Binary
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "bgiextractor" --add-data "src:src" bgie_app.py
    - name: Package into DEB
      run: |
        mkdir -p package/usr/bin
        mkdir -p package/DEBIAN
        cp dist/bgiextractor package/usr/bin/
        chmod +x package/usr/bin/bgiextractor
        cat << 'CTRL' > package/DEBIAN/control
        Package: bgiextractor
        Version: 1.0.0
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: myzert <zerttcihuy@gmail.com>
        Description: BGI Extractor
         Open-Source ARC Unpacker, Viewer & JSON Translation Toolkit.
        CTRL
        dpkg-deb --build package bgiextractor_1.0.0_amd64.deb
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bgiextractor_1.0.0_amd64.deb
        path: bgiextractor_1.0.0_amd64.deb

  create-release:
    needs: [build-windows, build-linux-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BGIExtractor-Win64.exe
      - uses: actions/download-artifact@v4
        with:
          name: bgiextractor_1.0.0_amd64.deb
      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "BGI Extractor - Latest Release"
          body: |
            ## BGI Extractor
            This release is automatically compiled by GitHub Actions.
            
            ### Downloads:
            - **Windows**: Download `BGIExtractor-Win64.exe` below. It is a portable standalone executable (no installation required).
            - **Linux**: Download `bgiextractor_1.0.0_amd64.deb` below and install it using `sudo dpkg -i bgiextractor_1.0.0_amd64.deb`.
          files: |
            BGIExtractor-Win64.exe
            bgiextractor_1.0.0_amd64.deb
