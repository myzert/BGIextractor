name: Build BGIE Executables

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "BGIExtractor" --add-data "src;src" bgie_app.py
    - name: Upload Windows Build
      uses: actions/upload-artifact@v3
      with:
        name: BGIExtractor-Windows
        path: dist/BGIExtractor

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller
    - name: Build Linux Binary with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "BGIExtractor" --add-data "src:src" bgie_app.py
    - name: Upload Linux Build
      uses: actions/upload-artifact@v3
      with:
        name: BGIExtractor-Linux
        path: dist/BGIExtractor
